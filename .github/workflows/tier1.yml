# make the documented gate real on every PR and push to main.
# Authoritative command matches OPERATING-MODEL.md / AGENTS.md:
#   python scripts/check_all.py --tier 1
name: tier1

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job only checks out code and runs tests.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -q -r requirements.txt
      - name: Tier 1
        run: |
          . .venv/bin/activate
          python scripts/check_all.py --tier 1
