name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The deckbuilding problem or workflow, in your own words.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The change you have in mind. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: checkboxes
    id: rules
    attributes:
      label: House rules
      description: DeckWright only builds from real Scryfall results and never invents card names.
      options:
        - label: This request fits that rule (or explains why it should not need to).
          required: true
