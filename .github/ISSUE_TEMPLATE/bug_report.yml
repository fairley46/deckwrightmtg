name: Bug report
description: Something in DeckWright does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys or the contents of your `.env` file.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
      placeholder: "I asked for a mono-red goblins deck and the build stopped with ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with ./run.sh
        2. Type "..."
        3. Pick commander "..."
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Output of `python -m deckwright.check`
      description: The preflight shows which layer (Scryfall, model, simulator) is failing.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: The terminal output from `./run.sh` around the time of the problem.
      render: text
  - type: input
    id: version
    attributes:
      label: DeckWright version or commit
      placeholder: "1.0.0 or the output of git rev-parse --short HEAD"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model connection
      options:
        - claude CLI
        - ANTHROPIC_API_KEY
        - Not sure
